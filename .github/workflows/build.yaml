name: build

on:
  push:
    tags: ['v*']
  pull_request:

env:
  GO_VERSION: '1.22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        include:
          - { goos: linux, goarch: amd64, cc: gcc }
          - { goos: linux, goarch: arm64, cc: aarch64-linux-gnu-gcc } # cross-toolchain ships on the runner
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # sqlite3 driver is CGO, so a C cross-compiler is needed for arm64
      - run: CC=${{ matrix.cc }} CGO_ENABLED=1 GOOS=${{ matrix.goos }} GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o viber2mqtt-linux-${{ matrix.goarch }} .
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: viber2mqtt-linux-${{ matrix.goarch }}
