name: build

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

env:
  GO_VERSION: '1.22'

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      - run: go vet ./...
      - run: go test ./...

  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        goarch: [amd64, arm64]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: ${{ env.GO_VERSION }}
      # fully static: no CGO, so no cross-compiler needed for arm64
      - run: CGO_ENABLED=0 GOOS=linux GOARCH=${{ matrix.goarch }} go build -ldflags="-s -w" -o viber2mqtt-linux-${{ matrix.goarch }} .
      # tagged release: each arch attaches its binary to the tag's release
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: viber2mqtt-linux-${{ matrix.goarch }}
      # main branch: stage binaries for the rolling "latest" release
      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-artifact@v4
        with:
          name: viber2mqtt-linux-${{ matrix.goarch }}
          path: viber2mqtt-linux-${{ matrix.goarch }}

  latest:
    needs: build
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    steps:
      # no path: both artifacts are flattened into the workspace root
      - uses: actions/download-artifact@v4
      - uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: "main @ ${{ github.sha }}"
          prerelease: true
          overwrite: true
          delete_tag: true
          body: Rolling build from main, refreshed on every commit.
          files: viber2mqtt-linux-*
